<h2>お問い合わせ</h2>

<p class="section-lead">
  拝観・法事・その他のご相談はお気軽にお問い合わせください。<br>
  お電話でのお問い合わせは <strong>0748-37-0688</strong> までどうぞ。
</p>



<div id="alert-area"></div>

<div class="contact-form" id="form-wrap">
  <p class="form-note">※ 印は必須項目です</p>
  <form id="contact-form" novalidate>
    
    <div style="display:none;" aria-hidden="true">
      <input type="text" name="website" value="" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="f-name">お名前<span class="required">※</span></label>
      <input type="text" id="f-name" name="name" required maxlength="100" autocomplete="name">
    </div>
    <div class="form-group">
      <label for="f-email">メールアドレス<span class="required">※</span></label>
      <input type="email" id="f-email" name="email" required maxlength="200" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="f-message">お問い合わせ内容<span class="required">※</span></label>
      <textarea id="f-message" name="message" required maxlength="2000"></textarea>
    </div>
    
    <p class="form-note" style="margin:16px 0 12px;">
      お預かりした個人情報は、お問い合わせへの回答とその記録のためにのみ利用いたします。
      詳しくは<a href="privacy.html">個人情報の取扱いについて</a>をご覧ください。
    </p>
    <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:12px;">
      送信する
    </button>
  </form>
</div>

<script>
(function () {
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbysJ7rw__BCjNh-Y8SUMmRYEytSz4-voImuAgJo-FlzUw3A_zdDznDpfW94uXtgWAt7/exec";

  var form   = document.getElementById('contact-form');
  var wrap   = document.getElementById('form-wrap');
  var btn    = document.getElementById('submit-btn');
  var alerts = document.getElementById('alert-area');

  function showAlert(kind, html) {
    alerts.innerHTML = '<div class="alert alert-' + kind + '">' + html + '</div>';
    alerts.scrollIntoView({ block: 'nearest' });
  }

  function busy(on) {
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spinner"></span>送信中…' : '送信する';
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!ENDPOINT) {
      showAlert('error', '送信先が設定されていません。お手数ですが、お電話にてご連絡ください。');
      return;
    }

    var name    = form.name.value.trim();
    var email   = form.email.value.trim();
    var message = form.message.value.trim();

    var errors = [];
    if (!name || name.length > 100) errors.push('お名前を100文字以内で入力してください。');
    if (!email || email.length > 200 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      errors.push('正しいメールアドレスを入力してください。');
    }
    if (!message || message.length > 2000) errors.push('お問い合わせ内容を2000文字以内で入力してください。');
    if (errors.length) {
      showAlert('error', errors.map(function (e) {
        return '<p style="margin:0 0 4px;">' + e + '</p>';
      }).join(''));
      return;
    }

    busy(true);

    // Content-Type を text/plain にすることで CORS のプリフライト(OPTIONS)を発生させない。
    // GAS はプリフライトに応答できないため、これを避けるのが要点。
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        name: name,
        email: email,
        message: message,
        website: form.website.value
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.result === 'success') {
          wrap.style.display = 'none';
          showAlert('success', 'お問い合わせを受け付けました。内容を確認の上、ご連絡いたします。');
        } else if (data && data.reason === 'rate_limited') {
          busy(false);
          showAlert('error', '送信が集中しています。しばらく時間をおいてからお試しください。');
        } else {
          busy(false);
          showAlert('error', '送信中にエラーが発生しました。お手数ですが、お電話にてご連絡ください。');
        }
      })
      .catch(function () {
        busy(false);
        showAlert('error', '送信できませんでした。通信環境をご確認いただくか、お電話にてご連絡ください。');
      });
  });
})();
</script>
